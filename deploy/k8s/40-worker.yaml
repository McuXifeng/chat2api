apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: browser-profiles
  namespace: chat2api
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: chat2api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: docker.io/library/chat2api-worker:current
          imagePullPolicy: Never
          env:
            - name: REDIS_URL
              value: "redis://redis.chat2api.svc.cluster.local:6379/0"
            - name: WORKER_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: SLOTS_PER_WORKER
              value: "2"
            - name: BROWSER_HEADLESS
              value: "true"
            - name: COOKIE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: chat2api-secrets, key: cookie-encryption-key }
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "2Gi" }
          volumeMounts:
            - name: profiles
              mountPath: /var/lib/browser-profiles
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: profiles
          persistentVolumeClaim:
            claimName: browser-profiles
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
